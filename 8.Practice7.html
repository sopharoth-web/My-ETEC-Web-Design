<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice8</title>
</head>
<body>
    <h1><b>Unordered List Exercise</b></h1>
    <h2><b>Example 1: Fruits</b></h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Mango</li>
    </ul>
    <h2><b>Example 2: School Supplies</b></h2>
    <ul style="list-style-type: square;">
        <li>Pen</li>
        <li>Notebook</li>
        <li>Ruler</li>
        <li>Eraser</li>
    </ul>
    <h2><b>Example 3: Hobbies</b></h2>
    <ul style="list-style-type: circle;">
        <li>Reading</li>
        <li>Drawing</li>
        <li>Playung Football</li>
        <li>Listening Music</li>
    </ul>
</body>
</html>
