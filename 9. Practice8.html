
<!DOCTYPE html>

<body>
    <h1><b>Unordered List Exercise</b></h1>
    <h2>Weekend Plan</h2>
    <ul style="list-style-type: disc;">
        <li>Morning
            <ul style="list-style-type: circle;">
                <li>Jogging</li>
                <li>Breakfast</li>
            </ul>
        </li>
        <li>Afternoon
            <ul style="list-style-type: square;">
                <li>Study HTML</li>
                <li>Practice CSS</li>
            </ul>
        </li>
        <li>Evening
            <ul style="list-style-type: circle;">
                <li>Watch movie</li>
                <li>Dinner with family</li>
            </ul>
        </li>
    </ul>
</body>
