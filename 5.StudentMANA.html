<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" style="width: 400px; margin: auto;">
        <h1 style="color: blue; text-align: center;"><u><i>Student Register</i></u></h1>

        <label>Enter Name:</label><br>
        <input type="text" name="name" placeholder="(e,g.Dara Jonh)" style="width: 100%;">
        <br><br>

        <label>Enter Email:</label><br>
        <input type="email" name="email" placeholder="(e,g.Darajonh123@gmail.com)" style="width: 100%;">
        <br><br>
        
        <label >Enter Password:</label><br>
        <input type="password" name="password" id="" placeholder="(e,g.dara123jonh)" style="width: 100%;">
        <br>
        <br>

        <label style="font-weight: bold;">Please Select Course to Register:</label><br>

        <select name="Course" id="" style="font-size: 15px; width: 100%;">
            <option value="69">Web Design + React.js($69)</option>
            <option value="69">Web Design + Veu.js ($69)</option>
            <option value="69">Php + Laravel($69)</option>
            <option value="69">Java + Spring Boot ($69)</option>
        </select>
        <br>
        <br>
        <label style="font-weight: bold;">Plese Select Course Time</label><br>
        <select name="time" id="" style="font-size: 15px;width: 100%;">
            <option value="">8:00a.m - 11:00a.m</option>
            <option value="">11:00a.m - 2:00p.m</option>
            <option value="">2:00p.m - 5:00p.m</option>
        </select>
        <br><br>
        <label style="font-weight: bold;">Please Select Course Day</label>
        <select name="Day" id="" style="font-size: 15px;width: 100%;">
            <option value="">Monday-Tuesday</option>
            <option value="">Wednesday-Thursday</option>
            <option value="">Saturday-Sunday</option>
        </select>

        <br><br>
        <label style="font-weight: bold;">Please Select Class Building</label>
        <select name="Building" id="" style="font-size: 15px;width: 100%;">
            <option value="">Building A</option>
            <option value="">Building B</option>
        </select>
        <br><br>

        <button type="submit">Submit</button>



    </form>
</body>
</html>
