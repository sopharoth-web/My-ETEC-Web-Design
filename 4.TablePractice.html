<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table  border="1" cellpadding="20px" cellspacing="0px">
        <tr>
            <th colspan="6" align="center"><b>Table</b></th>
        </tr>
        <tr>
            <th>0</th>
            <th>1</th>
            <th>2</th>
            <th>3</th>
            <th>4</th>
            <th>5</th>
        </tr>

        <tr>
            <th>1</th>
            <th rowspan="2">A</th>
            <th colspan="3">B</th>
            <th>C</th>
           
        </tr>
        <tr>
            <th>2</th>
            <th rowspan="2">D</th>
            <th>E</th>
            <th colspan="2">F</th>
            
        </tr>
        <tr>
            <th>3</th>
            <th>G</th>
            <th rowspan="2">H</th>
            <th colspan="2">I</th>
        </tr>
        <tr>
            <th>4</th>
            <th colspan="2">J</th>
            <th colspan="2">K</th>
        </tr>
        <tr>
            <th>5</th>
            <th rowspan="3">L</th>
            <th colspan="2">M</th>
            <th rowspan="2" colspan="2">N</th>
        </tr>
        <tr>
            <th>6</th>
            <th rowspan="2" colspan="2">O</th>
        </tr>
        <tr>
            <th>7</th>
            <th colspan="2">P</th>
        </tr>
        

    </table>
</body>
</html>
<!-- if we do directly by setting or calculating the numbers of col/row, the table will not know
 the real numbers of col/row of the table
 method: we add tr dedicating for numbers of columns in the whole table. 
         we add tr-th (numbers of row in each tr) to tell the tble the real numbers of rows in the table.  -->
