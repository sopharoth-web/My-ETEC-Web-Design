<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h1 align="center" style="color: brown;text-shadow: 2px 2px gray;"><b>Student Information</b></h1>
    <table border="1" style="width: 500px;" align="center" cellpadding="20px" cellspacing="0px">
        <thead> 
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Gender</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>001</td>
                <td>Jennie</td>
                <td>Female</td>
            </tr>
            <tr>
                <td>002</td>
                <td>Jack</td>
                <td>Male</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
