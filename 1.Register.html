<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <form action="/register">
        <h1><i><u>Register</u></i></h1>

        <label >Enter Firstname</label><br>
        <input type="text" name="firstname" placeholder="(e.g, Dara)"><br><br>

        <label >Enter Lastname</label><br>
        <input type="text" name="lastname" placeholder="(e.g, Jonhson)"><br><br>

        <label >Enter Email</label><br>
        <input type="email" name="email" placeholder="(e.g, dara1278@gmail.com)" required><br><br>

        <label >Enter Password</label><br>
        <input type="password" name="password" placeholder="(e.g, 12345678)" required>
        <br><br>

        <input type="checkbox">
        <label >Rememeber me</label>

        <button type="submit">Register</button>


    </form>

    
</body>
</html>
